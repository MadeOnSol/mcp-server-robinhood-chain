# Smithery + Glama configuration: https://smithery.ai/docs/config
# Robinhood Chain MCP Server - EVM-native trading intelligence (KOL tracker, deployer hunter, DEX tape)

startCommand:
  type: stdio
  configSchema:
    type: object
    description: >
      Requires MADEONSOL_API_KEY (free tier 200 req/day at https://madeonsol.com/pricing,
      bundled into every tier at no extra cost).
    properties:
      MADEONSOL_API_KEY:
        type: string
        title: "MadeOnSol API key (required)"
        description: >
          Your MadeOnSol API key, starts with msk_. Free tier (200 req/day, no card) at
          https://madeonsol.com/pricing. Unlocks the Robinhood Chain surface: KOL feed,
          deployer reputation, token discovery, DEX trade tape, and smart-money wallet
          ranking.
      MADEONSOL_API_URL:
        type: string
        default: "https://madeonsol.com"
        description: "MadeOnSol API base URL (defaults to https://madeonsol.com)."
  commandFunction:
    |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'mcp-server-robinhood-chain'],
      env: {
        MADEONSOL_API_KEY: config.MADEONSOL_API_KEY,
        MADEONSOL_API_URL: config.MADEONSOL_API_URL || 'https://madeonsol.com'
      }
    })
  exampleConfig:
    MADEONSOL_API_KEY: "msk_your_free_key_from_madeonsol_dot_com_pricing"
